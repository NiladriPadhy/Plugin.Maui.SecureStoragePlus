name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore Plugin.Maui.SecureStoragePlus.slnx

      - name: Build
        run: dotnet build Plugin.Maui.SecureStoragePlus.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Plugin.Maui.SecureStoragePlus.Tests/Plugin.Maui.SecureStoragePlus.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Plugin.Maui.SecureStoragePlus/Plugin.Maui.SecureStoragePlus.csproj -c Release --no-build
